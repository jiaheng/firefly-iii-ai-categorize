# Firefly III AI Categorization - Configuration File
# Copy this file to 'config.yaml' and update with your actual values
# Note: Environment variables will override these values if set

# Firefly III Configuration
firefly:
  # The URL to your Firefly III instance
  # Example: https://firefly.example.com
  url: ""
  
  # Your Firefly III Personal Access Token
  # You can generate this from: Options > Profile > OAuth > Personal Access Tokens
  personal_token: ""
  
  # The tag to assign to automatically categorized transactions
  # Default: "AI categorized"
  tag: "AI categorized"

# OpenAI Configuration
openai:
  # Your OpenAI API Key
  # Get this from: https://platform.openai.com/account/api-keys
  api_key: ""
  
  # The OpenAI model to use for categorization
  # Recommended options:
  #   - gpt-4o-mini (default): Best balance of cost and performance
  #   - gpt-4o: Most capable model for complex categorization
  #   - gpt-3.5-turbo: More economical alternative
  # Default: gpt-4o-mini
  model: "gpt-4o-mini"
  
  # Maximum number of tokens for completion
  # Controls the maximum length of the generated response
  # Higher values allow longer responses but increase cost
  # Default: 5000
  max_completion_tokens: 5000
  
  # Temperature for model responses (0.0 to 2.0)
  # Lower values (e.g., 0.3) make responses more consistent and deterministic
  # Higher values make responses more creative but less predictable
  # Set to null to omit the temperature parameter entirely from the OpenAI API request
  # This is useful for models that don't support the temperature parameter (e.g., gpt-4o-search-preview)
  # Default: 0.3
  temperature: 0.3
  
  # Pass transaction notes to OpenAI for categorization
  # When enabled, transaction notes (if present) will be included in the
  # OpenAI API payload to provide additional context for categorization
  # Note: This sends the note field to OpenAI's API
  # Default: false
  pass_note_to_openai: false
  
  # Web search options for enhanced categorization (optional)
  # Enables the model to use web search for better context
  # Uncomment and configure if you want to enable web search
  # Note: Requires a model that supports web search (e.g., gpt-4o-search-preview)
  # web_search_options:
  #   user_location:
  #     type: "approximate"
  #     approximate:
  #       country: "US"    # ISO 3166-1 alpha-2 country code (required)
  #       city: "Seattle"  # City name (optional, recommended for better results)
  #       region: "WA"     # State/region (optional, recommended for better results)

# Application Configuration
app:
  # The port where the application listens
  # Default: 3000
  port: 3000
  
  # Enable the web UI for monitoring
  # Default: false
  enable_ui: false

# Transaction Filtering Configuration
# These filters determine which transactions are sent to OpenAI for categorization
# All filters are optional and can be omitted to disable filtering
filters:
  # Minimum transaction amount threshold
  # Transactions with amount less than this value will not be sent to OpenAI
  # Set to 0 or omit to disable amount filtering
  # Example: 5.0 (will skip transactions below $5.00)
  # Default: 0 (disabled)
  min_amount: 0
  
  # Maximum transaction amount threshold
  # Transactions with amount greater than this value will not be sent to OpenAI
  # Set to 0 or omit to disable amount filtering
  # Example: 1000.0 (will skip transactions above $1000.00)
  # Default: 0 (disabled)
  max_amount: 0
  
  # List of destination names to exclude from categorization
  # Transactions with destination names matching any value in this list will be skipped
  # Use exact matches (case-sensitive)
  # Set to empty list [] or omit to disable destination filtering
  # Example: ["Coffee Shop", "Vending Machine", "ATM Withdrawal"]
  # Default: [] (disabled)
  exclude_destinations: []
